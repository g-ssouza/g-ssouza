<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro do Usuário — Academia G.A. Fitness</title>
  <link rel="stylesheet" href="./estilo2.css">
</head>
<body>

  <h1>Cadastro do Usuário</h1>
  <h2>Academia Geração Ativa Fitness</h2>

  <!-- action: para onde os dados vão | method: como eles vão -->
  <form action="https://formsubmit.co/f2fcc3fc9551d2650a5e45259043e2ab" method="POST">

    <!-- GRUPO 1: dados da pessoa -->
    <fieldset>
      <legend>Seus dados</legend>

      <p>
        <label for="nome">Nome completo *</label>
        <input class="campo" type="text" id="nome" name="nome" autocomplete="name" minlength="3" required>
      </p>

      <p>
        <label for="data">Data de Nascimento *</label>
        <input class="campo" type="date" id="data" name="data" required>
      </p>

      <p>
        <label for="email">E-mail *</label>
        <input class="campo" type="email" id="email" name="email" autocomplete="email" placeholder="voce@email.com" required>
      </p>

      <p>
        <label for="cpf">CPF *</label>
        <input class="campo" type="cpf" id="cpf" name="cpf" autocomplete="cpf" placeholder="111.222.333-44" required>
      </p>
      
      <p>
        <label for="senha">Senha *</label>
        <input class="campo" type="senha" id="senha" name="senha" autocomplete="senha" placeholder="Obrigatório" required>
      </p>

      <p>
        <label for="telefone">Celular</label>
        <input class="campo" type="tel" id="telefone" name="telefone" autocomplete="tel" placeholder="(11) 91234-5678">
      </p>

      
    </fieldset>

    <!-- GRUPO 2: dados da reserva -->
    <fieldset>
      <legend>Informações físicas</legend>

      <div class="campo">
<label>Altura (cm)</label>
<input type="number" placeholder="Ex: 175">
</div>

<div class="campo">
<label>Peso atual (kg)</label>
<input type="number" step="0.1" placeholder="Ex: 75">
</div>

<div class="campo">
<label>Já praticou musculação?</label>
<select>
<option value="">Selecione</option>
<option>Sim</option>
<option>Não</option>
</select>
</div>

<div class="campo">
<label>Nível de experiência</label>
<select>
<option value="">Selecione</option>
<option>Iniciante</option>
<option>Intermediário</option>
<option>Avançado</option>
</select>
</div>

</div>
</fieldset>
<fieldset>
<legend>Informações de saúde</legend>
<div class="campo full">
<label>Possui alguma doença ou condição de saúde?</label>
<div class="opcoes">
<label><input type="radio" name="doenca" value="Sim"> Sim</label>
<label><input type="radio" name="doenca" value="Não"> Não</label>
</div>
</div>

<div class="campo full">
<label>Se sim, qual(is)? (opcional)</label>
<textarea rows="2" placeholder="Informe apenas o que considerar necessário"></textarea>
</div>

<div class="campo full">
<label>Possui alguma deficiência?</label>
<div class="opcoes">
<label><input type="radio" name="deficiencia" value="Sim"> Sim</label>
<label><input type="radio" name="deficiencia" value="Não"> Não</label>
</div>
</div>

<div class="campo full">
<label>Se sim, deseja informar qual? (opcional)</label>
<textarea rows="2" placeholder="Descreva, se desejar"></textarea>
</div>

<div class="campo full">
<label>Possui alguma lesão ou limitação física?</label>
<div class="opcoes">
<label><input type="radio" name="lesao" value="Sim"> Sim</label>
<label><input type="radio" name="lesao" value="Não"> Não</label>
</div>
</div>

<div class="campo full">
<label>Faz uso de algum medicamento que possa interferir nos exercícios?</label>
<div class="opcoes">
<label><input type="radio" name="medicamento" value="Sim"> Sim</label>
<label><input type="radio" name="medicamento" value="Não"> Não</label>
</div>
</div>

<div class="campo full">
<label>Possui alguma restrição médica para atividades físicas?</label>
<div class="opcoes">
<label><input type="radio" name="restricao" value="Sim"> Sim</label>
<label><input type="radio" name="restricao" value="Não"> Não</label>
<label><input type="radio" name="restricao" value="Não sei"> Não sei</label>
</div>
</div>
    </fieldset>

    <fieldset>
    <legend>Rotina e hábitos</legend>
<div class="campo">
<label>Quantas vezes pretende treinar por semana?</label>
<select>
<option value="">Selecione</option>
<option>1 vez</option>
<option>2 vezes</option>
<option>3 vezes</option>
<option>4 vezes</option>
<option>5 vezes</option>
<option>6 vezes</option>
<option>Todos os dias</option>
</select>
</div>

<div class="campo">
<label>Quantas horas dorme por noite?</label>
<select>
<option value="">Selecione</option>
<option>Menos de 4 horas</option>
<option>4 a 5 horas</option>
<option>6 a 7 horas</option>
<option>8 a 9 horas</option>
<option>Mais de 9 horas</option>
</select>
</div>

<div class="campo">
<label>Como considera sua alimentação?</label>
<select>
<option value="">Selecione</option>
<option>Ruim</option>
<option>Regular</option>
<option>Boa</option>
<option>Excelente</option>
</select>
</div>

<div class="campo">
<label>Como é sua rotina diária?</label>
<select>
<option value="">Selecione</option>
<option>Mais sedentária</option>
<option>Moderadamente ativa</option>
<option>Muito ativa</option>
</select>
</div>

<div class="campo">
<label>Quantas horas trabalha por dia?</label>
<select>
<option value="">Selecione</option>
<option>Não trabalho</option>
<option>Até 4 horas</option>
<option>4 a 6 horas</option>
<option>6 a 8 horas</option>
<option>Mais de 8 horas</option>
</select>
</div>

<div class="campo">
<label>Consome água regularmente?</label>
<select>
<option value="">Selecione</option>
<option>Sim</option>
<option>Não</option>
<option>Às vezes</option>
</select>
</div>

</div>
</fieldset>
<fieldset>
<legend>Objetivos na academia</legend>
<div class="campo full">
<label>Qual é seu principal objetivo?</label>
<div class="opcoes">
<label><input type="checkbox" name="objetivo" value="Emagrecimento"> Emagrecimento</label>
<label><input type="checkbox" name="objetivo" value="Hipertrofia"> Ganho de massa muscular</label>
<label><input type="checkbox" name="objetivo" value="Condicionamento"> Condicionamento físico</label>
<label><input type="checkbox" name="objetivo" value="Saúde"> Saúde e qualidade de vida</label>
<label><input type="checkbox" name="objetivo" value="Flexibilidade"> Flexibilidade</label>
<label><input type="checkbox" name="objetivo" value="Força"> Ganho de força</label>
</div>
</div>
      <p>
        <label for="observacoes">Observações</label><br>
        <textarea class="campo" id="observacoes" name="observacoes" rows="4" cols="40"
                  placeholder="Ex.:Minha meta é ..."></textarea>
      </p>
    </fieldset>

    <p>
      <input type="checkbox" id="promocoes" name="promocoes" value="sim">
      <label for="promocoes">Quero receber as promoções da semana por e-mail</label>
    </p>

    <!-- BOTÕES -->
    <p>
      <button class="btn-enviar" type="submit" href="./treinos/index.html">Cadatrar</button>
      <button class="btn-limpar" type="reset">Limpar</button>
    </p>

  </form>
</body>
</html>
