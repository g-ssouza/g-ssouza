    <text x="164" y="269" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">HTML</text>
    <text x="164" y="305" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#8EA0BA">Estrutura das páginas</text>
  </g>
  <g class="card" style="animation-delay:0.48s">
    <rect x="425" y="205" width="350" height="140" rx="16" fill="#101828" stroke="#22304A" stroke-width="2"/>
