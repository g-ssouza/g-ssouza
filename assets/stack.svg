    <circle class="pulse" cx="491" cy="110" r="34" fill="#6DB33F" fill-opacity=".18" style="animation-delay:0.4s"/>
    <text x="491" y="119" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#6DB33F">SB</text>
    <text x="549" y="104" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Spring Boot</text>
    <text x="549" y="140" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#8EA0BA">Back-end e APIs</text>
  </g>
  <g class="card" style="animation-delay:0.24s">
    <rect x="810" y="40" width="350" height="140" rx="16" fill="#101828" stroke="#22304A" stroke-width="2"/>
    <rect x="810" y="40" width="8" height="140" rx="4" fill="#4FA3E0"/>
    <circle class="pulse" cx="876" cy="110" r="34" fill="#4FA3E0" fill-opacity=".18" style="animation-delay:0.8s"/>
