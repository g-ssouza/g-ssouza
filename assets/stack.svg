<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Minha stack de estudos</title>
  <desc id="d">Seis cartões: Java, Spring Boot, MySQL, HTML, CSS e Scrum.</desc>
  <style>
    .card { animation: rise .7s ease-out backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="380" rx="24" fill="#0A0F1A"/>
  <g class="card" style="animation-delay:0.00s">
    <rect x="40" y="40" width="350" height="140" rx="16" fill="#101828" stroke="#22304A" stroke-width="2"/>
    <rect x="40" y="40" width="8" height="140" rx="4" fill="#F89820"/>
    <circle class="pulse" cx="106" cy="110" r="34" fill="#F89820" fill-opacity=".18" style="animation-delay:0.0s"/>
    <text x="106" y="119" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#F89820">JV</text>
    <text x="164" y="104" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Java</text>
    <text x="164" y="140" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#8EA0BA">Linguagem principal</text>
  </g>
  <g class="card" style="animation-delay:0.12s">
