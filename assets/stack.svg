    <text x="934" y="104" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">MySQL</text>
    <text x="934" y="140" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#8EA0BA">Banco de dados</text>
  </g>
  <g class="card" style="animation-delay:0.36s">
