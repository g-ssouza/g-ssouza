    <text x="549" y="269" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">CSS</text>
    <text x="549" y="305" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#8EA0BA">Estilo e layout</text>
  </g>
  <g class="card" style="animation-delay:0.60s">
    <rect x="810" y="205" width="350" height="140" rx="16" fill="#101828" stroke="#22304A" stroke-width="2"/>
    <rect x="810" y="205" width="8" height="140" rx="4" fill="#2EC4B6"/>
    <circle class="pulse" cx="876" cy="275" r="34" fill="#2EC4B6" fill-opacity=".18" style="animation-delay:2.0s"/>
    <text x="876" y="284" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#2EC4B6">SC</text>
    <text x="934" y="269" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Scrum</text>
    <text x="934" y="305" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#8EA0BA">Metodologia ágil</text>
