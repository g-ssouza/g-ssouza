<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Seu Nome</title>
  <desc id="d">Banner animado: foto de perfil, nome digitado como em um terminal, linha do tempo Java, Spring, MySQL, HTML, CSS e Scrum.</desc>
  <defs>
    <clipPath id="photoClip"><circle cx="210" cy="290" r="118"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="600" rx="24"/></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6DB33F"/><stop offset="1" stop-color="#F89820"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6DB33F" stop-opacity="0"/><stop offset=".5" stop-color="#6DB33F" stop-opacity="0.09"/><stop offset="1" stop-color="#6DB33F" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .ch { animation: pop .05s linear backwards; }
    @keyframes pop { from { fill-opacity: 0; } to { fill-opacity: 1; } }
    .cursor { animation: blink 1s steps(1) infinite; animation-delay: 3.66s; }
    @keyframes blink { 0%,49% { fill-opacity: 1; } 50%,100% { fill-opacity: 0; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 22s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .halo { animation: halo 3.2s ease-in-out infinite; }
    @keyframes halo { 0%,100% { stroke-opacity: .15; } 50% { stroke-opacity: .6; } }
    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(640px); } }
    .dot { fill: #22304A; animation: lit 6s linear infinite; }
    @keyframes lit { 0% { fill: #F89820; } 13% { fill: #F89820; } 17%,100% { fill: #22304A; } }
    .sub { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 28px; fill: #B8C6DB; }
    .lbl { font-size: 18px; fill: #8EA0BA; letter-spacing: 1.5px; }
    .live { animation: live 1.8s ease-in-out infinite; }
    @keyframes live { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .rise { animation: rise .9s ease-out backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="600" rx="24" fill="#0A0F1A"/>
  <g clip-path="url(#frame)">
    <rect class="scan" width="1200" height="120" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="1198" height="598" rx="23" fill="none" stroke="#22304A" stroke-width="2"/>

  <!-- Barra de título -->
  <circle cx="44" cy="30" r="7" fill="#F89820"/><circle cx="68" cy="30" r="7" fill="#6DB33F"/><circle cx="92" cy="30" r="7" fill="#4FA3E0"/>
  <text x="124" y="37" font-size="20" fill="#8EA0BA">~/perfil/README.md</text>
  <text x="1156" y="37" font-size="20" fill="#8EA0BA" text-anchor="end">estudando todo dia</text>
  <circle class="live" cx="918" cy="30" r="6" fill="#6DB33F"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#22304A" stroke-width="2"/>

  <!-- Foto -->
  <g class="rise" style="animation-delay:.1s">
    <circle class="halo" cx="210" cy="290" r="150" fill="none" stroke="#6DB33F" stroke-width="3"/>
    <circle class="ring" cx="210" cy="290" r="136" fill="none" stroke="#F89820" stroke-width="3" stroke-dasharray="3 14" stroke-linecap="round"/>
    <circle cx="210" cy="290" r="122" fill="#101828" stroke="#22304A" stroke-width="4"/>
    <image href="data:image/jpeg;base64," x="92" y="172" width="236" height="236" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
    <text x="210" y="485" text-anchor="middle" font-size="20" fill="#8EA0BA">estudante de back-end</text>
  </g>

  <!-- Texto -->
  <rect x="400" y="112" width="6" height="22" fill="url(#bar)"/>
  <text x="420" y="131" font-size="20" fill="#6DB33F" letter-spacing="3" class="rise" style="animation-delay:.2s">BACK-END · JAVA · SPRING BOOT</text>

  <g filter="url(#glow)">
    <text x="400" y="240" font-size="104" font-weight="800" fill="#E6EDF7" xml:space="preserve"><tspan class="ch" style="animation-delay:0.60s">S</tspan><tspan class="ch" style="animation-delay:0.71s">E</tspan><tspan class="ch" style="animation-delay:0.82s">U</tspan><tspan class="ch" style="animation-delay:0.93s"> </tspan><tspan class="ch" style="animation-delay:1.04s">N</tspan><tspan class="ch" style="animation-delay:1.15s">O</tspan><tspan class="ch" style="animation-delay:1.26s">M</tspan><tspan class="ch" style="animation-delay:1.37s">E</tspan></text>
  </g>
  <text x="402" y="300" class="rise sub" style="animation-delay:1.48s">Desenvolvedor em formação · Java e Spring Boot</text>

  <!-- Linha do tempo -->
  <line x1="410" y1="385" x2="1100" y2="385" stroke="#22304A" stroke-width="3"/>
  <rect class="dot" x="401" y="376" width="18" height="18" rx="3" style="animation-delay:3.96s"/><text x="410" y="426" text-anchor="middle" class="lbl">JAVA</text><rect class="dot" x="539" y="376" width="18" height="18" rx="3" style="animation-delay:4.96s"/><text x="548" y="426" text-anchor="middle" class="lbl">SPRING</text><rect class="dot" x="677" y="376" width="18" height="18" rx="3" style="animation-delay:5.96s"/><text x="686" y="426" text-anchor="middle" class="lbl">MYSQL</text><rect class="dot" x="815" y="376" width="18" height="18" rx="3" style="animation-delay:6.96s"/><text x="824" y="426" text-anchor="middle" class="lbl">HTML</text><rect class="dot" x="953" y="376" width="18" height="18" rx="3" style="animation-delay:7.96s"/><text x="962" y="426" text-anchor="middle" class="lbl">CSS</text><rect class="dot" x="1091" y="376" width="18" height="18" rx="3" style="animation-delay:8.96s"/><text x="1100" y="426" text-anchor="middle" class="lbl">SCRUM</text>

  <!-- Terminal -->
  <rect x="380" y="470" width="780" height="92" rx="12" fill="#070B14" stroke="#22304A" stroke-width="2"/>
  <text x="410" y="528" font-size="30" xml:space="preserve"><tspan fill="#6DB33F">dev@lab:~$ </tspan><tspan class="ch" style="animation-delay:1.98s" fill="#E6EDF7">j</tspan><tspan class="ch" style="animation-delay:2.05s" fill="#E6EDF7">a</tspan><tspan class="ch" style="animation-delay:2.12s" fill="#E6EDF7">v</tspan><tspan class="ch" style="animation-delay:2.19s" fill="#E6EDF7">a</tspan><tspan class="ch" style="animation-delay:2.26s" fill="#E6EDF7"> </tspan><tspan class="ch" style="animation-delay:2.33s" fill="#E6EDF7">-</tspan><tspan class="ch" style="animation-delay:2.40s" fill="#E6EDF7">j</tspan><tspan class="ch" style="animation-delay:2.47s" fill="#E6EDF7">a</tspan><tspan class="ch" style="animation-delay:2.54s" fill="#E6EDF7">r</tspan><tspan class="ch" style="animation-delay:2.61s" fill="#E6EDF7"> </tspan><tspan class="ch" style="animation-delay:2.68s" fill="#E6EDF7">a</tspan><tspan class="ch" style="animation-delay:2.75s" fill="#E6EDF7">p</tspan><tspan class="ch" style="animation-delay:2.82s" fill="#E6EDF7">r</tspan><tspan class="ch" style="animation-delay:2.89s" fill="#E6EDF7">e</tspan><tspan class="ch" style="animation-delay:2.96s" fill="#E6EDF7">n</tspan><tspan class="ch" style="animation-delay:3.03s" fill="#E6EDF7">d</tspan><tspan class="ch" style="animation-delay:3.10s" fill="#E6EDF7">e</tspan><tspan class="ch" style="animation-delay:3.17s" fill="#E6EDF7">n</tspan><tspan class="ch" style="animation-delay:3.24s" fill="#E6EDF7">d</tspan><tspan class="ch" style="animation-delay:3.31s" fill="#E6EDF7">o</tspan><tspan class="ch" style="animation-delay:3.38s" fill="#E6EDF7">.</tspan><tspan class="ch" style="animation-delay:3.45s" fill="#E6EDF7">j</tspan><tspan class="ch" style="animation-delay:3.52s" fill="#E6EDF7">a</tspan><tspan class="ch" style="animation-delay:3.59s" fill="#E6EDF7">r</tspan><tspan class="cursor" fill="#F89820">█</tspan></text>
</svg>
